<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión BREAD de mascotas - Veterinaria Laika">
  <title>Admin - Mascotas | Veterinaria Laika</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg admin-navbar py-2">
      <div class="container">
        
        <a href="dashboard.html" class="logo me-lg-4">
          <div class="logo-circulo-crop">
            <img src="../assets/images/logo1.png" alt="Logo Veterinaria Laika" class="logo-img-zoom">
          </div>
          <span>Laika Admin</span>
        </a>

        <button class="navbar-toggler admin-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarMenu" aria-controls="adminNavbarMenu" aria-expanded="false" aria-label="Abrir navegación">
          <span class="admin-toggler-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbarMenu">
          <div class="admin-nav-wrapper">
            <ul class="navbar-nav gap-1 gap-lg-2 mb-3 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="dashboard.html">
                  <span class="nav-icon">📊</span> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item active" href="mascotas.html">
                  <span class="nav-icon">🐶</span> Mascotas
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="veterinarios.html">
                  <span class="nav-icon">🩺</span> Veterinarios
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="turnos.html">
                  <span class="nav-icon">📅</span> Turnos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="historias.html">
                  <span class="nav-icon">📋</span> Historia Clínica
                </a>
              </li>
            </ul>

            <div class="admin-nav-actions d-flex flex-column flex-lg-row gap-2">
              <button class="btn btn-outline-secondary btn-sm px-3 py-2" id="btn-modo-oscuro" type="button">
                🌙 Modo Oscuro
              </button>
              <a href="../index.html" class="boton boton-secundario text-decoration-none py-2 px-3 text-center d-inline-flex align-items-center justify-content-center gap-2">
                <span>🌐</span> Ver Sitio Web
              </a>
            </div>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <main class="container my-4">
    <div class="tarjeta-admin p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <h3 class="m-0" style="font-family: var(--font-titulos); color: var(--color-principal-oscuro);">
          Gestión de Mascotas <span id="total-mascotas" class="badge bg-primary fs-6 align-middle ms-2">0</span>
        </h3>
        <button class="boton boton-principal" onclick="abrirModalNuevaMascota()">+ Registrar Mascota</button>
      </div>

      <!-- Buscador en tiempo real -->
      <div class="mb-3">
        <input type="search" id="buscar-mascota" class="form-control" placeholder="🔍 Buscar por nombre, dueño o color..." oninput="filtrarTablaMascotas()">
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Foto</th>
              <th>Mascota</th>
              <th>Dueño</th>
              <th>Color</th>
              <th>Edad</th>
              <th>Peso (kg)</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-mascotas"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Mascota -->
  <div class="modal fade" id="modalMascota" tabindex="-1" aria-labelledby="tituloModalMascota" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-mascota">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="tituloModalMascota">Mascota</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="mascota-id">
            <div class="mb-3">
              <label for="mascota-nombre" class="form-label fw-bold">Nombre Mascota</label>
              <input type="text" id="mascota-nombre" class="form-control" placeholder="Ej: Firulais" required>
            </div>
            <div class="mb-3">
              <label for="mascota-duenio" class="form-label fw-bold">Nombre Dueño</label>
              <input type="text" id="mascota-duenio" class="form-control" placeholder="Ej: Juan Pérez" required>
            </div>
            <div class="row g-2">
              <div class="col-12 col-sm-4 mb-3">
                <label for="mascota-color" class="form-label fw-bold">Color</label>
                <input type="text" id="mascota-color" class="form-control" placeholder="Ej: Marrón" required>
              </div>
              <div class="col-12 col-sm-4 mb-3">
                <label for="mascota-edad" class="form-label fw-bold">Edad (Años)</label>
                <input type="number" id="mascota-edad" class="form-control" min="0" placeholder="Ej: 3" required>
              </div>
              <div class="col-12 col-sm-4 mb-3">
                <label for="mascota-peso" class="form-label fw-bold">Peso (kg)</label>
                <input type="number" step="0.1" id="mascota-peso" class="form-control" min="0" placeholder="Ej: 12.5" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="mascota-file" class="form-label fw-bold">Foto Mascota</label>
              <input type="file" id="mascota-file" class="form-control" accept="image/*">
              <input type="hidden" id="mascota-base64">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="boton boton-principal">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-mascotas.js"></script>
</body>
</html>
