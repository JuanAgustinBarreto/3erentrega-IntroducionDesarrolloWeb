<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de agendamiento de turnos - Veterinaria Laika">
  <title>Admin - Turnos | Veterinaria Laika</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg admin-navbar py-2">
      <div class="container">
        
        <a href="dashboard.html" class="logo me-lg-4">
          <div class="logo-circulo-crop">
            <img src="../assets/images/logo1.png" alt="Logo Veterinaria Laika" class="logo-img-zoom">
          </div>
          <span>Laika Admin</span>
        </a>

        <button class="navbar-toggler admin-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarMenu" aria-controls="adminNavbarMenu" aria-expanded="false" aria-label="Abrir navegación">
          <span class="admin-toggler-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbarMenu">
          <div class="admin-nav-wrapper">
            <ul class="navbar-nav gap-1 gap-lg-2 mb-3 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="dashboard.html">
                  <span class="nav-icon">📊</span> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="mascotas.html">
                  <span class="nav-icon">🐶</span> Mascotas
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="veterinarios.html">
                  <span class="nav-icon">🩺</span> Veterinarios
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item active" href="turnos.html">
                  <span class="nav-icon">📅</span> Turnos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="historias.html">
                  <span class="nav-icon">📋</span> Historia Clínica
                </a>
              </li>
            </ul>

            <div class="admin-nav-actions d-flex flex-column flex-lg-row gap-2">
              <button class="btn btn-outline-secondary btn-sm px-3 py-2" id="btn-modo-oscuro" type="button">
                🌙 Modo Oscuro
              </button>
              <a href="../index.html" class="boton boton-secundario text-decoration-none py-2 px-3 text-center d-inline-flex align-items-center justify-content-center gap-2">
                <span>🌐</span> Ver Sitio Web
              </a>
            </div>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <main class="container my-4">
    <div class="tarjeta-admin p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0" style="font-family: var(--font-titulos); color: var(--color-principal-oscuro);">Control de Turnos</h3>
        <button class="boton boton-principal" onclick="abrirModalTurno()">+ Agendar Turno</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha y Hora</th>
              <th>Mascota</th>
              <th>Veterinario Asignado</th>
              <th>Costo Consulta</th>
              <th class="text-end">Acción</th>
            </tr>
          </thead>
          <tbody id="tabla-turnos"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Turno -->
  <div class="modal fade" id="modalTurno" tabindex="-1" aria-labelledby="tituloModalTurno" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-turno">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="tituloModalTurno">Agendar Turno</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="turno-fechahora" class="form-label fw-bold">Fecha y Hora</label>
              <input type="datetime-local" id="turno-fechahora" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="turno-mascota" class="form-label fw-bold">Mascota</label>
              <select id="turno-mascota" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label for="turno-vet" class="form-label fw-bold">Veterinario</label>
              <select id="turno-vet" class="form-select" required></select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="boton boton-principal">Confirmar Turno</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-turnos.js"></script>
</body>
</html>
