<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de historia clínica de mascotas - Veterinaria Laika">
  <title>Admin - Historia Clínica | Veterinaria Laika</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <header class="sticky-top">
    <nav class="navbar navbar-expand-lg admin-navbar py-2">
      <div class="container">
        
        <a href="dashboard.html" class="logo me-lg-4">
          <div class="logo-circulo-crop">
            <img src="../assets/images/logo1.png" alt="Logo Veterinaria Laika" class="logo-img-zoom">
          </div>
          <span>Laika Admin</span>
        </a>

        <button class="navbar-toggler admin-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarMenu" aria-controls="adminNavbarMenu" aria-expanded="false" aria-label="Abrir navegación">
          <span class="admin-toggler-icon">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbarMenu">
          <div class="admin-nav-wrapper">
            <ul class="navbar-nav gap-1 gap-lg-2 mb-3 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="dashboard.html">
                  <span class="nav-icon">📊</span> Dashboard
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="mascotas.html">
                  <span class="nav-icon">🐶</span> Mascotas
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="veterinarios.html">
                  <span class="nav-icon">🩺</span> Veterinarios
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item" href="turnos.html">
                  <span class="nav-icon">📅</span> Turnos
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link admin-nav-item active" href="historias.html">
                  <span class="nav-icon">📋</span> Historia Clínica
                </a>
              </li>
            </ul>

            <div class="admin-nav-actions d-flex flex-column flex-lg-row gap-2">
              <button class="btn btn-outline-secondary btn-sm px-3 py-2" id="btn-modo-oscuro" type="button">
                🌙 Modo Oscuro
              </button>
              <a href="../index.html" class="boton boton-secundario text-decoration-none py-2 px-3 text-center d-inline-flex align-items-center justify-content-center gap-2">
                <span>🌐</span> Ver Sitio Web
              </a>
            </div>
          </div>
        </div>

      </div>
    </nav>
  </header>

  <main class="container my-4">
    <div class="tarjeta-admin p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <h3 class="m-0" style="font-family: var(--font-titulos); color: var(--color-principal-oscuro);">Historias Clínicas</h3>
        <div class="d-flex align-items-center gap-2">
          <label for="filtro-mascota" class="fw-bold mb-0">Filtrar Mascota:</label>
          <select id="filtro-mascota" class="form-select" onchange="renderHistorias()"></select>
        </div>
        <button class="boton boton-principal" onclick="abrirModalHistoria()">+ Registrar Consulta</button>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha/Hora</th>
              <th>Mascota</th>
              <th>Veterinario</th>
              <th>Peso Visita</th>
              <th>Temp (°C)</th>
              <th>Próx. Control</th>
              <th>Observaciones</th>
            </tr>
          </thead>
          <tbody id="tabla-historias"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Historia Clínica -->
  <div class="modal fade" id="modalHistoria" tabindex="-1" aria-labelledby="tituloModalHistoria" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="form-historia">
          <div class="modal-header">
            <h5 class="modal-title fw-bold" id="tituloModalHistoria">Registrar Atención Médica</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="hist-fechahora" class="form-label fw-bold">Fecha y Hora</label>
              <input type="datetime-local" id="hist-fechahora" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="hist-mascota" class="form-label fw-bold">Mascota Paciente</label>
              <select id="hist-mascota" class="form-select" required></select>
            </div>
            <div class="mb-3">
              <label for="hist-vet" class="form-label fw-bold">Veterinario Tratante</label>
              <select id="hist-vet" class="form-select" required></select>
            </div>
            <div class="row g-2">
              <div class="col-12 col-sm-4 mb-3">
                <label for="hist-peso" class="form-label fw-bold">Peso (kg)</label>
                <input type="number" step="0.1" id="hist-peso" class="form-control" placeholder="Ej: 12.5" required>
              </div>
              <div class="col-12 col-sm-4 mb-3">
                <label for="hist-temp" class="form-label fw-bold">Temp (°C)</label>
                <input type="number" step="0.1" id="hist-temp" class="form-control" placeholder="Ej: 38.5" required>
              </div>
              <div class="col-12 col-sm-4 mb-3">
                <label for="hist-proxcontrol" class="form-label fw-bold">Próx. Control</label>
                <input type="date" id="hist-proxcontrol" class="form-control">
              </div>
            </div>
            <div class="mb-3">
              <label for="hist-obs" class="form-label fw-bold">Observaciones Médicas</label>
              <textarea id="hist-obs" class="form-control" rows="3" placeholder="Escriba las notas del examen..." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="boton boton-principal">Guardar Ficha</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/admin-historias.js"></script>
</body>
</html>
